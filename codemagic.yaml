# Codemagic CI for the nabu XNU port.
#
# AppVeyor kills every macOS build after ~10 minutes and GitHub's macOS runners
# need a billing method, so this workflow drives the same one-shot script that
# a rented Mac would run. Free tier: 500 macOS minutes/month.
#
# The kernel build emits far more warnings than Codemagic keeps in a step log
# (8 MB), so the script's output goes to a file and only the errors are echoed.

workflows:
  nabu-xnu:
    name: XNU 8796 for nabu
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      vars:
        # xnu-8796.141.3 is the tag that matches the iPadOS 16.6.1 userland.
        MACOS_VERSION: "13.5"
        KERNEL_CONFIG: "RELEASE"
        MACHINE_CONFIG: "NABU"
        JOBS: "2"
    scripts:
      - name: Toolchain check
        script: |
          sw_vers
          /usr/bin/xcodebuild -version || true
          ls -1 /Applications | grep -i xcode || true
          df -h / | tail -1
      - name: Install missing tools
        script: |
          for tool in jq ninja cmake gum; do
            command -v "$tool" >/dev/null 2>&1 || brew install "$tool" || true
          done
          command -v jq || brew install jq
      - name: Build kernel
        script: |
          cd "$CM_BUILD_DIR"
          bash scripts/build-on-mac.sh > "$CM_BUILD_DIR/build-console.log" 2>&1 || rc=$?
          rc=${rc:-0}
          echo "=== build exited with rc=$rc ==="
          echo "=== build log size: $(wc -c < "$CM_BUILD_DIR/build-console.log") bytes ==="
          if [ "$rc" != "0" ]; then
            echo "=== unique compile errors ==="
            grep -a -E ": error: |\*\*\* \[|Undefined symbols|ld: error|clang: error" "$CM_BUILD_DIR/build-console.log" \
              | grep -a -v "patch" | sort -u | head -40
            echo "=== last 6 kB of the log ==="
            tail -c 6000 "$CM_BUILD_DIR/build-console.log"
            exit 1
          fi
      - name: Collect artifacts
        script: |
          mkdir -p build-artifacts
          find . -name "kernel.*.nabu" -exec cp {} build-artifacts/ \; || true
          find build-artifacts -type f -exec shasum -a 256 {} \; || true
          ls -la build-artifacts
    artifacts:
      - build-artifacts/**
      - unixnu-nabu-build/out/**
      - out/**
      - build-console.log

  probe-xcode:
    name: probe xcode versions
    instance_type: mac_mini_m1
    max_build_duration: 15
    scripts:
      - name: list xcodes
        script: |
          sw_vers
          ls -1 /Applications | grep -i xcode || true
          /usr/bin/xcodebuild -version || true

  unixnu-nabu:
    name: UniXNU nabu kernel
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      vars:
        UNIXNU_REF: "245aca1a9ec5b730b1cad80fade295800d2981f1"
        PROFILE: "nabu_ufs_readonly_defconfig"
    scripts:
      - name: Toolchain check
        script: |
          sw_vers
          /usr/bin/xcodebuild -version || true
          df -h / | tail -1
      - name: Build UniXNU nabu kernel
        script: |
          cd "$CM_BUILD_DIR"
          bash scripts/build-unixnu-nabu.sh > "$CM_BUILD_DIR/unixnu-build.log" 2>&1 || rc=$?
          rc=${rc:-0}
          echo "=== unixnu build exited with rc=$rc ==="
          tail -n 120 "$CM_BUILD_DIR/unixnu-build.log"
          if [ "$rc" != "0" ]; then exit 1; fi
    artifacts:
      - unixnu-build.log
      - unixnu/out/**
      - "**/kernel.macho"
      - "**/*.adt"
      - "**/*.trustcache"
      - source-prepare.json